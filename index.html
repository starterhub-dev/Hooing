// ---------------- procedural textures ----------------
function makeTexture(p){
  const cv=document.createElement('canvas'); cv.width=512; cv.height=256;
  const c=cv.getContext('2d');
  const baseHex='#'+p.color.toString(16).padStart(6,'0');
  c.fillStyle=baseHex; c.fillRect(0,0,512,256);
  if(p.earthlike){
    // Local fallback: equirectangular ocean with recognizable continent silhouettes.
    // The higher-detail NASA Blue Marble map replaces this as soon as it loads.
    c.fillStyle='#09244b'; c.fillRect(0,0,512,256);
    const land='#6d8060';
    const drawLand=(points,fill=land)=>{
      c.beginPath();
      points.forEach((pt,i)=>i===0?c.moveTo(pt[0],pt[1]):c.lineTo(pt[0],pt[1]));
      c.closePath(); c.fillStyle=fill; c.fill();
    };
    drawLand([[0,48],[25,38],[47,42],[60,31],[77,36],[97,51],[119,55],[132,67],[119,83],[106,87],[99,102],[87,115],[74,103],[63,88],[47,81],[36,65],[18,63]]);
    drawLand([[111,119],[127,126],[143,143],[145,164],[137,184],[129,207],[120,231],[112,207],[108,181],[103,156]]);
    drawLand([[144,29],[159,22],[174,28],[169,44],[154,48]]);
    drawLand([[205,55],[217,44],[233,47],[242,59],[258,53],[275,58],[288,52],[311,58],[333,62],[354,70],[378,66],[398,83],[387,95],[368,91],[353,101],[340,91],[325,102],[308,94],[296,82],[278,88],[260,79],[245,89],[231,82],[217,76]]);
    drawLand([[239,88],[258,91],[272,106],[278,127],[270,151],[257,177],[244,157],[238,136],[229,116]]);
    drawLand([[280,96],[296,97],[306,113],[298,127],[287,116]]);
    drawLand([[304,114],[320,119],[330,139],[324,157],[315,145]]);
    drawLand([[377,137],[393,131],[412,142],[425,154],[420,166],[404,169],[394,159],[384,154]]);
    drawLand([[441,178],[457,173],[473,183],[465,193],[448,190]]);
    drawLand([[0,239],[30,235],[70,241],[110,236],[150,242],[190,237],[230,243],[270,238],[310,242],[350,236],[390,242],[430,238],[470,242],[512,236],[512,256],[0,256]],'#aab5b7');
  }
  if(p.craters){
    for(let i=0;i<70;i++){
      const x=Math.random()*512,y=Math.random()*256,r=Math.random()*10+2;
      const g=c.createRadialGradient(x-r*0.3,y-r*0.3,0,x,y,r);
      g.addColorStop(0,'rgba(0,0,0,0.35)'); g.addColorStop(0.7,'rgba(0,0,0,0.15)'); g.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
    }
  }
  if(p.bands){
    for(let y=0;y<256;y+=1){
      if(Math.random()>0.55){
        c.fillStyle=`rgba(255,255,255,${Math.random()*0.08})`;
        c.fillRect(0,y,512,Math.random()*3+1);
        c.fillStyle=`rgba(0,0,0,${Math.random()*0.06})`;
        c.fillRect(0,y+1,512,Math.random()*2+1);
      }
    }
  }
  if(p.id==='sun'){
    for(let i=0;i<200;i++){
      const x=Math.random()*512,y=Math.random()*256;
      c.fillStyle=`rgba(255,${150+Math.random()*80|0},${Math.random()*60|0},${Math.random()*0.3})`;
      c.beginPath(); c.arc(x,y,Math.random()*6+2,0,Math.PI*2); c.fill();
    }
  }
  // Layered micro-relief: fine grain, crater rims and soft atmospheric/cloud streaks.
  const grain=c.getImageData(0,0,cv.width,cv.height),px=grain.data;
  for(let i=0;i<px.length;i+=4){
    const n=(Math.random()-.5)*9;
    px[i]=Math.max(0,Math.min(255,px[i]+n));
    px[i+1]=Math.max(0,Math.min(255,px[i+1]+n));
    px[i+2]=Math.max(0,Math.min(255,px[i+2]+n));
  }
  c.putImageData(grain,0,0);
  if(p.craters){
    for(let i=0;i<110;i++){
      const x=Math.random()*cv.width,y=Math.random()*cv.height,r=2+Math.random()*13;
      const g=c.createRadialGradient(x-r*.22,y-r*.28,1,x,y,r);
      g.addColorStop(0,'rgba(0,0,0,.34)');g.addColorStop(.58,'rgba(0,0,0,.12)');
      g.addColorStop(.78,'rgba(255,255,255,.13)');g.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
    }
  }
  // Earth clouds are included in the geographic texture, not procedurally scattered.
  if(p.id==='jupiter'){
    const storm=c.createRadialGradient(350,130,3,350,130,38);
    storm.addColorStop(0,'rgba(145,55,34,.8)');storm.addColorStop(.7,'rgba(175,85,55,.35)');storm.addColorStop(1,'rgba(175,85,55,0)');
    c.fillStyle=storm;c.beginPath();c.ellipse(350,130,42,16,-.12,0,Math.PI*2);c.fill();
  }
  return new THREE.CanvasTexture(cv);
}

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
camera.position.set(0,0,5);

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

// starfield background (points)
{
  const geo=new THREE.BufferGeometry();
  const N=1200, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=30+Math.random()*40, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);

  }

let sphere, ringMesh, atmosphereMesh, coronaSprite=null, coronaMesh=null;
let planetBuildToken=0;
const bodyTextureCache=Object.create(null);
const bodyTexturePending=Object.create(null);
function loadBodyTexture(p,mat,buildToken){
  const url=PLANET_TEXTURES[p.id];
  if(!url)return;
  const applyTexture=(texture)=>{
    if(!texture||buildToken!==planetBuildToken)return;
    const previous=mat.map;
    mat.map=texture;
    mat.color.set(0xffffff);
    mat.needsUpdate=true;
    if(previous&&previous!==texture&&previous.image&&previous.image.tagName==='CANVAS')previous.dispose();
  };
  if(bodyTextureCache[p.id]){applyTexture(bodyTextureCache[p.id]);return;}
  if(!bodyTexturePending[p.id]){
    bodyTexturePending[p.id]=new Promise(resolve=>{
      const loader=new THREE.TextureLoader();
      loader.setCrossOrigin('anonymous');
      loader.load(url,texture=>{
        texture.encoding=THREE.sRGBEncoding;
        texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
        texture.minFilter=THREE.LinearMipmapLinearFilter;
        texture.magFilter=THREE.LinearFilter;
        texture.generateMipmaps=true;
        texture.needsUpdate=true;
        bodyTextureCache[p.id]=texture;
        delete bodyTexturePending[p.id];
        resolve(texture);
      },undefined,error=>{
        console.warn('Planet texture failed to load:',p.id,url,error);
        delete bodyTexturePending[p.id];
        resolve(null);
      });
    });
  }
  bodyTexturePending[p.id].then(texture=>applyTexture(texture));
}
const group=new THREE.Group(); scene.add(group);
let sceneMode='near';
const galaxyGroup=new THREE.Group();scene.add(galaxyGroup);
function makeGlowTexture(){
  const cv=document.createElement('canvas');cv.width=cv.height=256;
  const c=cv.getContext('2d');
  const g=c.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,248,232,0.98)');
  g.addColorStop(.10,'rgba(255,219,170,0.75)');
  g.addColorStop(.28,'rgba(255,167,142,0.28)');
  g.addColorStop(.55,'rgba(130,122,255,0.09)');
  g.addColorStop(1,'rgba(70,100,255,0)');
  c.fillStyle=g;c.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(cv);
}
function addGalaxyGlow(parent,x,y,z,size,tint,opacity){
  const texture=makeGlowTexture();
  const material=new THREE.SpriteMaterial({map:texture,color:tint,transparent:true,opacity,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const sprite=new THREE.Sprite(material);
  sprite.position.set(x,y,z);sprite.scale.set(size,size,1);sprite.renderOrder=2;
  parent.add(sprite);
}
function buildGalaxy(){
  // A layered spiral galaxy: a dense stellar disk, warmer central bulge, colored nebula and subtle arm filaments.
  const count=26000,pos=new Float32Array(count*3),col=new Float32Array(count*3);
  const palettes=[
    [0.58,0.72,1.00],[0.76,0.82,1.00],[1.00,0.89,0.70],
    [1.00,0.97,0.88],[0.92,0.61,0.80],[0.52,0.77,1.00]
  ];
  for(let i=0;i<count;i++){
    const arm=i%4;
    const r=Math.pow(Math.random(),.72)*6.45;
    const angle=r*.78+arm*Math.PI/2+(Math.random()-.5)*(.22+r*.035);
    const spread=(Math.random()-.5)*(.09+r*.035);
    const rr=Math.max(.04,r+spread);
    pos[i*3]=Math.cos(angle)*rr;
    pos[i*3+1]=(Math.random()-.5)*(.05+r*.055);
    pos[i*3+2]=Math.sin(angle)*rr;
    const palette=palettes[Math.random()<.12?4:(Math.random()<.13?2:(Math.random()<.24?0:3))];
    const brightness=.35+Math.pow(Math.random(),2)*.9;
    col[i*3]=Math.min(1,palette[0]*brightness);
    col[i*3+1]=Math.min(1,palette[1]*brightness);
    col[i*3+2]=Math.min(1,palette[2]*brightness);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  galaxyGroup.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.034,vertexColors:true,
    transparent:true,opacity:.96,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true})));

  // A compact, bright core with a thicker cloud of old stars.
  const coreCount=6200,cp=new Float32Array(coreCount*3),cc=new Float32Array(coreCount*3);
  for(let i=0;i<coreCount;i++){
    const r=Math.pow(Math.random(),2.35)*1.72;
    const a=Math.random()*Math.PI*2;
    cp[i*3]=Math.cos(a)*r;
    cp[i*3+1]=(Math.random()-.5)*(.12+r*.09);
    cp[i*3+2]=Math.sin(a)*r;
    const q=.55+Math.random()*.45;
    cc[i*3]=q;cc[i*3+1]=q*(.78+Math.random()*.18);cc[i*3+2]=q*(.48+Math.random()*.32);
  }
  const cg=new THREE.BufferGeometry();
  cg.setAttribute('position',new THREE.BufferAttribute(cp,3));
  cg.setAttribute('color',new THREE.BufferAttribute(cc,3));
  galaxyGroup.add(new THREE.Points(cg,new THREE.PointsMaterial({size:.045,vertexColors:true,
    transparent:true,opacity:.95,depthWrite:false,blending:THREE.AdditiveBlending})));
  const core=new THREE.Mesh(new THREE.SphereGeometry(.24,32,32),
    new THREE.MeshBasicMaterial({color:0xffd8ac,transparent:true,opacity:.8}));
  galaxyGroup.add(core);
  addGalaxyGlow(galaxyGroup,0,0,0,3.2,0xffc38d,.88);
  addGalaxyGlow(galaxyGroup,-1.9,.05,1.45,2.7,0x668cff,.42);
  addGalaxyGlow(galaxyGroup,2.5,-.04,-1.15,2.8,0xb77bff,.35);
  addGalaxyGlow(galaxyGroup,-3.25,.04,-1.75,2.4,0x4d9fff,.30);
  addGalaxyGlow(galaxyGroup,3.55,-.02,1.85,2.5,0xff7cb4,.24);

  // Very faint spiral filaments add shape without turning the galaxy into neon wireframe.
  for(let arm=0;arm<4;arm++){
    const pts=[];
    for(let i=0;i<=120;i++){
      const t=i/120,r=.55+t*5.95,a=r*.78+arm*Math.PI/2;
      pts.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(t*8+arm)*(.025+r*.012),Math.sin(a)*r));
    }
    const curve=new THREE.CatmullRomCurve3(pts);
    const tube=new THREE.TubeGeometry(curve,180,.012,5,false);
    const filament=new THREE.Mesh(tube,new THREE.MeshBasicMaterial({
      color:[0x6e9fff,0x8a8cff,0xff9dc5,0x8ad7ff][arm],
      transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false
    }));
    galaxyGroup.add(filament);
  }
  galaxyGroup.rotation.set(.78,.03,-.08);
}
buildGalaxy();
galaxyGroup.visible=false;

function buildPlanet(p){
  const buildToken=++planetBuildToken;
  if(sphere){group.remove(sphere); sphere.geometry.dispose(); if(sphere.material.map&&sphere.material.map.image&&sphere.material.map.image.tagName==='CANVAS')sphere.material.map.dispose(); sphere.material.dispose();}
  if(ringMesh){group.remove(ringMesh); ringMesh.geometry.dispose(); if(ringMesh.material.map)ringMesh.material.map.dispose(); ringMesh.material.dispose();ringMesh=null;}
  if(atmosphereMesh){group.remove(atmosphereMesh);atmosphereMesh.geometry.dispose();atmosphereMesh.material.dispose();atmosphereMesh=null;}
  if(coronaSprite){group.remove(coronaSprite);if(coronaSprite.material.map)coronaSprite.material.map.dispose();coronaSprite.material.dispose();coronaSprite=null;}
  if(coronaMesh){group.remove(coronaMesh);coronaMesh.geometry.dispose();coronaMesh.material.dispose();coronaMesh=null;}
  const tex=makeTexture(p);
  const geo=new THREE.SphereGeometry(p.size,64,64);
  let mat;
  if(p.id==='sun'){
    mat=new THREE.MeshBasicMaterial({map:tex,color:0xffffff});
  } else if(p.id==='earth'){
    mat=new THREE.MeshPhongMaterial({map:tex,color:0xffffff,specular:new THREE.Color(0x17263a),shininess:8});
  } else if(p.id==='moon'||p.id==='mercury'||p.id==='mars'){
    mat=new THREE.MeshStandardMaterial({map:tex,color:0xffffff,roughness:1,metalness:0});
  } else {
    mat=new THREE.MeshStandardMaterial({map:tex,color:0xffffff,roughness:.88,metalness:0});
  }
  sphere=new THREE.Mesh(geo,mat);
  group.add(sphere);
  loadBodyTexture(p,mat,buildToken);

  if(p.id==='sun'){
    // Soft additive corona behind the solar disc.
    const coronaMat=new THREE.SpriteMaterial({map:makeGlowTexture(),color:0xffa74b,transparent:true,
      opacity:.82,blending:THREE.AdditiveBlending,depthWrite:false});
    coronaSprite=new THREE.Sprite(coronaMat);
    coronaSprite.position.z=-.08;
    coronaSprite.scale.set(p.size*3.5,p.size*3.5,1);
    group.add(coronaSprite);
    coronaMesh=new THREE.Mesh(new THREE.SphereGeometry(p.size*1.06,48,48),
      new THREE.MeshBasicMaterial({color:0xff9d38,transparent:true,opacity:.07,side:THREE.BackSide,depthWrite:false}));
    group.add(coronaMesh);
  }

  const atmospheres={
    earth:{scale:1.026,color:0x62b8ff,opacity:.15},
    venus:{scale:1.065,color:0xffc16e,opacity:.12},
    mars:{scale:1.034,color:0xe47755,opacity:.085},
    jupiter:{scale:1.018,color:0xd8b48f,opacity:.055},
    saturn:{scale:1.018,color:0xf1d9a0,opacity:.055},
    uranus:{scale:1.045,color:0x8ef2f4,opacity:.13},
    neptune:{scale:1.042,color:0x5180ff,opacity:.15}
  };
  if(atmospheres[p.id]){
    const profile=atmospheres[p.id];
    const ag=new THREE.SphereGeometry(p.size*profile.scale,56,56);
    atmosphereMesh=new THREE.Mesh(ag,new THREE.MeshBasicMaterial({
      color:profile.color,transparent:true,opacity:profile.opacity,
      side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending
    }));
    group.add(atmosphereMesh);
  }

  if(p.rings){
    const rg=new THREE.RingGeometry(p.size*1.4,p.size*2.3,64);
    const pos=rg.attributes.position;
    const uv=rg.attributes.uv;
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i), y=pos.getY(i);
      const dist=Math.sqrt(x*x+y*y);
      const t=(dist-p.size*1.4)/(p.size*0.9);
      uv.setXY(i,t,0);
    }
    const rc=document.createElement('canvas'); rc.width=1024; rc.height=8;
    const rctx=rc.getContext('2d');
    for(let x=0;x<1024;x++){
      const t=x/1024;
      const bands=Math.sin(x*.071)*.5+Math.sin(x*.193)*.25+Math.sin(x*.41)*.12;
      const gap=((x>170&&x<196)||(x>612&&x<631)||(x>780&&x<792));
      const brightness=Math.max(.12,Math.min(1,.54+bands));
      const alpha=gap?0.025:(.22+brightness*.52);
      const r=188+Math.round(brightness*42),g=166+Math.round(brightness*47),b=124+Math.round(brightness*55);
      rctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
      rctx.fillRect(x,0,1,8);
    }
    const ringTex=new THREE.CanvasTexture(rc);
    ringTex.needsUpdate=true;
    const rmat=new THREE.MeshBasicMaterial({map:ringTex,side:THREE.DoubleSide,transparent:true,opacity:.92,
      depthWrite:false,blending:THREE.NormalBlending});
    ringMesh=new THREE.Mesh(rg,rmat);
    ringMesh.rotation.x=Math.PI/2.3;
    group.add(ringMesh);
  }
}

function applyPlanet(idx){
  currentIndex=idx; const p=PLANETS[idx];
  buildPlanet(p);
  document.getElementById('info-tag').textContent=p.tag;
  document.getElementById('info-name').textContent=p.name;
  document.getElementById('info-desc').textContent=p.desc;
  document.getElementById('stat-d').textContent=p.d;
  document.getElementById('stat-p').textContent=p.p;
  document.querySelectorAll('.dock-item').forEach((el,i)=>el.classList.toggle('active',i===idx));
  playClick();
}

// ---------------- dock ----------------
const dock=document.getElementById('dock');
PLANETS.forEach((p,i)=>{
  const el=document.createElement('div'); el.className='dock-item'+(i===currentIndex?' active':'');
  const dot=document.createElement('div'); dot.className='dot';
  dot.style.background=`radial-gradient(circle at 35% 35%, #${(p.color).toString(16).padStart(6,'0')}, #111)`;
  const label=document.createElement('span'); label.textContent=p.name;
  el.appendChild(dot); el.appendChild(label);
  el.addEventListener('click',()=>applyPlanet(i));
  dock.appendChild(el);
});

// ---------------- drag to rotate / zoom ----------------
let dragging=false,lastX=0,lastY=0,rotX=0.15,rotY=0;
renderer.domElement.style.pointerEvents='auto';
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
  if(!dragging)return;
  rotY+=(e.clientX-lastX)*0.005; rotX+=(e.clientY-lastY)*0.005;
  rotX=Math.max(-1.2,Math.min(1.2,rotX));
  lastX=e.clientX; lastY=e.clientY;
});
renderer.domElement.addEventListener('wheel',e=>{
  const min=sceneMode==='galaxy'?7:2.5;
  const max=sceneMode==='galaxy'?23:9;
  camera.position.z=Math.max(min,Math.min(max,camera.position.z+e.deltaY*0.003));
},{passive:true});

function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',onResize);

let autoSpin=0;
function animate(){
  autoSpin+=0.0015;
  group.rotation.x+=(rotX-group.rotation.x)*0.08;
  group.rotation.y+=(rotY+autoSpin-group.rotation.y)*0.08;
  galaxyGroup.rotation.y+=.0007;
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}

// ---------------- audio ----------------
let audioCtx=null,soundOn=true,ambientNodes=null;
function ensureAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
    catch(e){soundOn=false;return null;}}
  if(audioCtx.state==='suspended')audioCtx.resume(); return audioCtx;
}
function startAmbient(){const c=ensureAudio(); if(!c||ambientNodes)return;
  const o1=c.createOscillator(),o2=c.createOscillator(),g=c.createGain();
  o1.type='sine';o1.frequency.value=50; o2.type='sine';o2.frequency.value=74; g.gain.value=0;
  o1.connect(g);o2.connect(g);g.connect(c.destination);o1.start();o2.start();
  g.gain.linearRampToValueAtTime(0.03,c.currentTime+2); ambientNodes={o1,o2,g};}
function stopAmbient(){if(!ambientNodes||!audioCtx)return; const{o1,o2,g}=ambientNodes;
  g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.4);
  setTimeout(()=>{try{o1.stop();o2.stop();}catch(e){}},500); ambientNodes=null;}
function playClick(){const c=ensureAudio(); if(!c||!soundOn)return;
  const o=c.createOscillator(),g=c.createGain(); o.type='sine';
  o.frequency.setValueAtTime(500,c.currentTime); o.frequency.exponentialRampToValueAtTime(220,c.currentTime+0.12);
  g.gain.setValueAtTime(0.1,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.16);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.16);}
document.getElementById('sound-toggle').addEventListener('click',function(){
  soundOn=!soundOn; this.textContent=soundOn?'🔊':'🔇';
  if(soundOn){startAmbient();} else stopAmbient();
});
function renderDock(){
  const ids=sceneMode==='near'?['earth','moon']:['sun','mercury','venus','earth','mars','jupiter','saturn','uranus','neptune'];
  document.querySelectorAll('.dock-item').forEach((el,i)=>{
    el.style.display=ids.includes(PLANETS[i].id)?'flex':'none';
    el.classList.toggle('active',i===currentIndex);
  });
  document.getElementById('dock').style.display=sceneMode==='galaxy'?'none':'flex';
}
function setMode(mode){
  sceneMode=mode;
  document.querySelectorAll('.scale-tabs span').forEach((el,i)=>el.classList.toggle('active',['near','solar','galaxy'][i]===mode));
  const hint=document.getElementById('rotate-hint');
  if(mode==='galaxy'){
    camera.position.set(0,0,15.5);
    rotX=.15;rotY=0;
    group.visible=false;galaxyGroup.visible=true;
    document.getElementById('info-tag').textContent='MILKY WAY · 01';
    document.getElementById('info-name').textContent='银河系';
    document.getElementById('info-desc').textContent='旋转视角，探索恒星与旋臂构成的银河结构。这里展示的是程序生成的示意模型。';
    document.getElementById('stat-d').textContent='约 10万光年';
    document.getElementById('stat-p').textContent='约 2.3亿年';
    hint.textContent='拖动旋转 · 双指或滚轮缩放';
  }else{
    camera.position.set(0,0,mode==='near'?5:5.6);
    galaxyGroup.visible=false;group.visible=true;
    const preferred=mode==='near'?'earth':'sun';
    if(!(mode==='near'?['earth','moon']:['sun','mercury','venus','earth','mars','jupiter','saturn','uranus','neptune']).includes(PLANETS[currentIndex].id)){
      currentIndex=PLANETS.findIndex(p=>p.id===preferred);
    }
    applyPlanet(currentIndex);
    hint.textContent=mode==='near'?'地月探索 · 拖动旋转':'选择天体 · 拖动旋转';
  }
  renderDock();playClick();
}
document.querySelectorAll('.scale-tabs span').forEach((el,i)=>{
  el.setAttribute('role','button');el.setAttribute('tabindex','0');
  const run=()=>setMode(['near','solar','galaxy'][i]);
  el.addEventListener('click',run);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run();}});
});
document.getElementById('reset-view').addEventListener('click',()=>{
  rotX=.15;rotY=0;camera.position.set(0,0,sceneMode==='galaxy'?15.5:(sceneMode==='near'?5:5.6));playClick();
});
let pinchDistance=0;
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===2)pinchDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinchDistance)camera.position.z=Math.max(sceneMode==='galaxy'?7:2.5,Math.min(sceneMode==='galaxy'?23:9,camera.position.z+(pinchDistance-d)*.012));
    pinchDistance=d;
  }
},{passive:false});
renderer.domElement.addEventListener('touchend',()=>pinchDistance=0,{passive:true});

applyPlanet(currentIndex);
renderDock();
startAmbient();
onResize();
animate();
</script>
</body>
