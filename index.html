<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIT · 宇宙漫游</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{color-scheme:dark;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  background:#05070c;color:#fff;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;}
#scene{position:absolute;inset:0;z-index:1;}
#topbar{position:fixed;z-index:10;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;pointer-events:none;}
.brand{display:flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:2px;color:rgba(255,255,255,.55);}
.brand b{color:#fff;font-size:.95rem;letter-spacing:3px;}
.scale-tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:4px;pointer-events:auto;backdrop-filter:blur(8px);}
.scale-tabs span{padding:6px 14px;font-size:.75rem;border-radius:16px;cursor:pointer;color:rgba(255,255,255,.5);transition:.2s;}
.scale-tabs span.active{background:rgba(255,255,255,.12);color:#fff;}

#info{position:fixed;z-index:10;left:20px;top:calc(72px + env(safe-area-inset-top,0px));
  max-width:260px;pointer-events:none;}
#info .tag{font-size:.7rem;letter-spacing:3px;color:rgba(255,255,255,.4);margin-bottom:6px;}
#info h1{font-size:2.1rem;font-weight:600;margin:0 0 10px;letter-spacing:2px;}
#info p{font-size:.8rem;line-height:1.7;color:rgba(255,255,255,.55);margin:0 0 16px;}
.stats{display:flex;gap:26px;}
.stats div b{display:block;font-size:1.1rem;font-weight:600;}
.stats div span{font-size:.68rem;color:rgba(255,255,255,.4);letter-spacing:1px;}

#rotate-hint{position:fixed;z-index:10;right:20px;bottom:calc(140px + env(safe-area-inset-bottom,0px));
  font-size:.7rem;color:rgba(255,255,255,.3);letter-spacing:1px;pointer-events:none;text-align:right;}

#dock{position:fixed;z-index:10;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);display:flex;gap:14px;background:rgba(10,14,22,.6);
  border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:10px 16px;backdrop-filter:blur(10px);
  pointer-events:auto;max-width:92vw;overflow-x:auto;}
.dock-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;opacity:.55;transition:.2s;}
.dock-item.active{opacity:1;}
.dock-item .dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;}
.dock-item.active .dot{border-color:#fff;}
.dock-item span{font-size:.65rem;letter-spacing:1px;white-space:nowrap;}

#sound-toggle{position:fixed;z-index:10;top:calc(16px + env(safe-area-inset-top,0px));right:20px;
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);
  color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;}

#reset-view{position:fixed;z-index:10;right:18px;bottom:calc(188px + env(safe-area-inset-bottom,0px));
 border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:9px 12px;background:rgba(10,14,22,.62);
 color:rgba(255,255,255,.8);font:inherit;font-size:.72rem;backdrop-filter:blur(10px);cursor:pointer;pointer-events:auto;}
#scene canvas{touch-action:none;display:block;}
@media(max-width:600px){
 #topbar{padding:0 12px;top:calc(12px + env(safe-area-inset-top,0px));}
 .brand{font-size:.65rem;gap:5px;letter-spacing:1px}.brand b{font-size:.82rem;letter-spacing:2px}
 .scale-tabs{gap:2px;padding:3px}.scale-tabs span{padding:7px 9px;font-size:.66rem}
 #info{left:16px;top:calc(66px + env(safe-area-inset-top,0px));max-width:220px}
 #info h1{font-size:1.7rem}#info p{font-size:.74rem;line-height:1.55}
 .stats{gap:18px}#dock{gap:11px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:96vw;padding:9px 12px}
 .dock-item .dot{width:25px;height:25px}#rotate-hint{right:14px;bottom:calc(118px + env(safe-area-inset-bottom,0px));font-size:.62rem}
 #reset-view{right:14px;bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div id="scene"></div>
<button id="sound-toggle" title="开关音效" aria-label="开关音效">🔊</button>
<button id="reset-view" type="button">↺ 重置视角</button>
<div id="topbar">
  <div class="brand"><b>ORBIT</b> 宇宙漫游</div>
  <div class="scale-tabs">
    <span class="active">近地轨道</span><span>太阳系</span><span>银河系</span>
  </div>
</div>
<div id="info">
  <div class="tag" id="info-tag">MOON · 01</div>
  <h1 id="info-name">月球</h1>

  <div class="stats">
    <div><b id="stat-d">3,474 km</b><span>平均直径</span></div>

  </div>
</div>
<div id="rotate-hint">拖动旋转 · 滚轮缩放</div>
<div id="dock"></div>

<script>
// ---------------- data ----------------
const PLANETS=[
 {id:'sun',name:'太阳',tag:'SUN · 00',desc:'太阳系的中心恒星，万物光与热的源头。',d:'1,392,000 km',p:'—',color:0xffcf6b,emissive:0xff9d2e,size:2.4,rings:false,bands:false,craters:false},
 {id:'mercury',name:'水星',tag:'MERCURY · 02',desc:'距太阳最近的行星，昼夜温差极端。',d:'4,879 km',p:'88 天',color:0x9a9a95,size:1.0,rings:false,bands:false,craters:true},
 {id:'venus',name:'金星',tag:'VENUS · 03',desc:'浓密大气笼罩下的炽热世界。',d:'12,104 km',p:'225 天',color:0xe0c08a,size:1.3,rings:false,bands:false,craters:false},
 {id:'earth',name:'地球',tag:'EARTH · 04',desc:'已知唯一孕育生命的蓝色星球。',d:'12,742 km',p:'365.25 天',color:0x3c6fd1,land:0x4a9c5d,size:1.35,rings:false,bands:false,craters:false,earthlike:true},
 {id:'moon',name:'月球',tag:'MOON · 01',desc:'越过寂静的月海与环形山，回望远处的蓝色地球。',d:'3,474 km',p:'27.3 天',color:0xb9b6ae,size:1.0,rings:false,bands:false,craters:true},
 {id:'mars',name:'火星',tag:'MARS · 05',desc:'赤铁矿覆盖的荒凉红色沙漠行星。',d:'6,779 km',p:'687 天',color:0xb3542f,size:1.05,rings:false,bands:false,craters:true},
 {id:'jupiter',name:'木星',tag:'JUPITER · 06',desc:'太阳系最大的行星，条纹风暴横贯全身。',d:'139,820 km',p:'11.9 年',color:0xd8b48f,size:1.9,rings:false,bands:true,craters:false},
 {id:'saturn',name:'土星',tag:'SATURN · 07',desc:'以壮丽星环闻名的气态巨行星。',d:'116,460 km',p:'29.5 年',color:0xe3cf9e,size:1.75,rings:true,bands:true,craters:false},
 {id:'uranus',name:'天王星',tag:'URANUS · 08',desc:'侧躺着自转的淡青色冰巨星。',d:'50,724 km',p:'84 年',color:0x9fdede,size:1.5,rings:false,bands:false,craters:false},
 {id:'neptune',name:'海王星',tag:'NEPTUNE · 09',desc:'太阳系最外侧，风速最快的深蓝冰巨星。',d:'49,244 km',p:'165 年',color:0x3d5fd0,size:1.5,rings:false,bands:false,craters:false}
];
let currentIndex=4; // moon default

// ---------------- procedural textures ----------------
function makeTexture(p){
  const cv=document.createElement('canvas'); cv.width=512; cv.height=256;
  const c=cv.getContext('2d');
  const baseHex='#'+p.color.toString(16).padStart(6,'0');
  c.fillStyle=baseHex; c.fillRect(0,0,512,256);
  if(p.earthlike){
    const landHex='#'+p.land.toString(16).padStart(6,'0');
    c.fillStyle=landHex;
    for(let i=0;i<14;i++){
      const x=Math.random()*512,y=Math.random()*256,r=Math.random()*40+20;
      c.beginPath();
      for(let a=0;a<Math.PI*2;a+=0.4){
        const rr=r*(0.6+Math.random()*0.6);
        const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
        a===0?c.moveTo(px,py):c.lineTo(px,py);
      }
      c.closePath(); c.fill();
    }
    c.fillStyle='rgba(255,255,255,0.5)';
    for(let i=0;i<6;i++){const x=Math.random()*512,y=Math.random()*80;c.beginPath();c.ellipse(x,y,60,18,0,0,Math.PI*2);c.fill();}
  }
  if(p.craters){
    for(let i=0;i<70;i++){
      const x=Math.random()*512,y=Math.random()*256,r=Math.random()*10+2;
      const g=c.createRadialGradient(x-r*0.3,y-r*0.3,0,x,y,r);
      g.addColorStop(0,'rgba(0,0,0,0.35)'); g.addColorStop(0.7,'rgba(0,0,0,0.15)'); g.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
    }
  }
  if(p.bands){
    for(let y=0;y<256;y+=1){
      if(Math.random()>0.55){
        c.fillStyle=`rgba(255,255,255,${Math.random()*0.08})`;
        c.fillRect(0,y,512,Math.random()*3+1);
        c.fillStyle=`rgba(0,0,0,${Math.random()*0.06})`;
        c.fillRect(0,y+1,512,Math.random()*2+1);
      }
    }
  }
  if(p.id==='sun'){
    for(let i=0;i<200;i++){
      const x=Math.random()*512,y=Math.random()*256;
      c.fillStyle=`rgba(255,${150+Math.random()*80|0},${Math.random()*60|0},${Math.random()*0.3})`;
      c.beginPath(); c.arc(x,y,Math.random()*6+2,0,Math.PI*2); c.fill();
    }
  }
  // Layered micro-relief: fine grain, crater rims and soft atmospheric/cloud streaks.
  const grain=c.getImageData(0,0,cv.width,cv.height),px=grain.data;
  for(let i=0;i<px.length;i+=4){
    const n=(Math.random()-.5)*9;
    px[i]=Math.max(0,Math.min(255,px[i]+n));
    px[i+1]=Math.max(0,Math.min(255,px[i+1]+n));
    px[i+2]=Math.max(0,Math.min(255,px[i+2]+n));
  }
  c.putImageData(grain,0,0);
  if(p.craters){
    for(let i=0;i<110;i++){
      const x=Math.random()*cv.width,y=Math.random()*cv.height,r=2+Math.random()*13;
      const g=c.createRadialGradient(x-r*.22,y-r*.28,1,x,y,r);
      g.addColorStop(0,'rgba(0,0,0,.34)');g.addColorStop(.58,'rgba(0,0,0,.12)');
      g.addColorStop(.78,'rgba(255,255,255,.13)');g.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
    }
  }
  if(p.earthlike){
    for(let i=0;i<80;i++){
      c.strokeStyle='rgba(245,250,255,'+(Math.random()*.10)+')';c.lineWidth=1+Math.random()*5;
      c.beginPath();const x=Math.random()*cv.width,y=Math.random()*cv.height;
      c.ellipse(x,y,10+Math.random()*80,1+Math.random()*5,Math.random()*.3,0,Math.PI*2);c.stroke();
    }
  }
  if(p.id==='jupiter'){
    const storm=c.createRadialGradient(350,130,3,350,130,38);
    storm.addColorStop(0,'rgba(145,55,34,.8)');storm.addColorStop(.7,'rgba(175,85,55,.35)');storm.addColorStop(1,'rgba(175,85,55,0)');
    c.fillStyle=storm;c.beginPath();c.ellipse(350,130,42,16,-.12,0,Math.PI*2);c.fill();
  }
  return new THREE.CanvasTexture(cv);
}

// ---------------- three.js setup ----------------
const container=document.getElementById('scene');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
camera.position.set(0,0,5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
container.appendChild(renderer.domElement);

const ambient=new THREE.AmbientLight(0x404050,1.1);
scene.add(ambient);
const sun=new THREE.DirectionalLight(0xffffff,1.6);
sun.position.set(3,2,4);
scene.add(sun);

// starfield background (points)
{
  const geo=new THREE.BufferGeometry();
  const N=1200, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=30+Math.random()*40, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:0xffffff,size:0.06,transparent:true,opacity:0.7});
  scene.add(new THREE.Points(geo,mat));
}

let sphere, ringMesh, atmosphereMesh;
const group=new THREE.Group(); scene.add(group);
let sceneMode='solar';
const galaxyGroup=new THREE.Group();scene.add(galaxyGroup);
function buildGalaxy(){
  const count=4600,pos=new Float32Array(count*3),col=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const arm=i%4,r=Math.pow(Math.random(),.62)*7.5;
    const a=r*.78+arm*Math.PI/2+(Math.random()-.5)*.55;
    pos[i*3]=Math.cos(a)*r;pos[i*3+1]=(Math.random()-.5)*(.1+r*.07);pos[i*3+2]=Math.sin(a)*r;
    const core=Math.max(0,1-r/7.5);col[i*3]=.58+core*.4;col[i*3+1]=.65+core*.26;col[i*3+2]=.82+core*.16;
  }
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  galaxyGroup.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.92,depthWrite:false})));
  const core=new THREE.Mesh(new THREE.SphereGeometry(.38,24,24),new THREE.MeshBasicMaterial({color:0xffd7a3,transparent:true,opacity:.7}));
  galaxyGroup.add(core);galaxyGroup.rotation.x=.35;
}
buildGalaxy();

function buildPlanet(p){
  if(sphere){group.remove(sphere); sphere.geometry.dispose(); sphere.material.dispose();}
  if(ringMesh){group.remove(ringMesh); ringMesh.geometry.dispose(); ringMesh.material.dispose();}
  if(atmosphereMesh){group.remove(atmosphereMesh);atmosphereMesh.geometry.dispose();atmosphereMesh.material.dispose();atmosphereMesh=null;}
  const tex=makeTexture(p);
  const geo=new THREE.SphereGeometry(p.size,64,64);
  const matOpts={map:tex,roughness:1};
  let mat;
  if(p.id==='sun'){
    mat=new THREE.MeshBasicMaterial({map:tex});
  } else {
    mat=new THREE.MeshStandardMaterial({map:tex,roughness:0.95,metalness:0.05});
  }
  sphere=new THREE.Mesh(geo,mat);
  group.add(sphere);
  if(['earth','venus','mars'].includes(p.id)){
    const ag=new THREE.SphereGeometry(p.size*1.055,48,48);
    const ac=p.id==='earth'?0x4b9fff:(p.id==='venus'?0xf0c78e:0xe47755);
    atmosphereMesh=new THREE.Mesh(ag,new THREE.MeshBasicMaterial({color:ac,transparent:true,opacity:p.id==='earth'?.22:.10,side:THREE.BackSide,depthWrite:false}));
    group.add(atmosphereMesh);
  }

  if(p.rings){
    const rg=new THREE.RingGeometry(p.size*1.4,p.size*2.3,64);
    const pos=rg.attributes.position;
    const uv=rg.attributes.uv;
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i), y=pos.getY(i);
      const dist=Math.sqrt(x*x+y*y);
      const t=(dist-p.size*1.4)/(p.size*0.9);
      uv.setXY(i,t,0);
    }
    const rc=document.createElement('canvas'); rc.width=256; rc.height=4;
    const rctx=rc.getContext('2d');
    for(let x=0;x<256;x++){
      const a=0.25+Math.random()*0.5;
      rctx.fillStyle=`rgba(226,205,160,${a})`;
      rctx.fillRect(x,0,1,4);
    }
    const ringTex=new THREE.CanvasTexture(rc);
    const rmat=new THREE.MeshBasicMaterial({map:ringTex,side:THREE.DoubleSide,transparent:true,opacity:0.85});
    ringMesh=new THREE.Mesh(rg,rmat);
    ringMesh.rotation.x=Math.PI/2.3;
    group.add(ringMesh);
  }
}

function applyPlanet(idx){
  currentIndex=idx; const p=PLANETS[idx];
  buildPlanet(p);
  document.getElementById('info-tag').textContent=p.tag;
  document.getElementById('info-name').textContent=p.name;
  document.getElementById('info-desc').textContent=p.desc;
  document.getElementById('stat-d').textContent=p.d;
  document.getElementById('stat-p').textContent=p.p;
  document.querySelectorAll('.dock-item').forEach((el,i)=>el.classList.toggle('active',i===idx));
  playClick();
}

// ---------------- dock ----------------
const dock=document.getElementById('dock');
PLANETS.forEach((p,i)=>{
  const el=document.createElement('div'); el.className='dock-item'+(i===currentIndex?' active':'');
  const dot=document.createElement('div'); dot.className='dot';
  dot.style.background=`radial-gradient(circle at 35% 35%, #${(p.color).toString(16).padStart(6,'0')}, #111)`;
  const label=document.createElement('span'); label.textContent=p.name;
  el.appendChild(dot); el.appendChild(label);
  el.addEventListener('click',()=>applyPlanet(i));
  dock.appendChild(el);
});

// ---------------- drag to rotate / zoom ----------------
let dragging=false,lastX=0,lastY=0,rotX=0.15,rotY=0;
renderer.domElement.style.pointerEvents='auto';
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
  if(!dragging)return;
  rotY+=(e.clientX-lastX)*0.005; rotX+=(e.clientY-lastY)*0.005;
  rotX=Math.max(-1.2,Math.min(1.2,rotX));
  lastX=e.clientX; lastY=e.clientY;
});
renderer.domElement.addEventListener('wheel',e=>{
  camera.position.z=Math.max(2.5,Math.min(9,camera.position.z+e.deltaY*0.003));
},{passive:true});

function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',onResize);

let autoSpin=0;
function animate(){
  autoSpin+=0.0015;
  group.rotation.x+=(rotX-group.rotation.x)*0.08;
  group.rotation.y+=(rotY+autoSpin-group.rotation.y)*0.08;
  galaxyGroup.rotation.y+=.0007;
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}

// ---------------- audio ----------------
let audioCtx=null,soundOn=true,ambientNodes=null;
function ensureAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
    catch(e){soundOn=false;return null;}}
  if(audioCtx.state==='suspended')audioCtx.resume(); return audioCtx;
}
function startAmbient(){const c=ensureAudio(); if(!c||ambientNodes)return;
  const o1=c.createOscillator(),o2=c.createOscillator(),g=c.createGain();
  o1.type='sine';o1.frequency.value=50; o2.type='sine';o2.frequency.value=74; g.gain.value=0;
  o1.connect(g);o2.connect(g);g.connect(c.destination);o1.start();o2.start();
  g.gain.linearRampToValueAtTime(0.03,c.currentTime+2); ambientNodes={o1,o2,g};}
function stopAmbient(){if(!ambientNodes||!audioCtx)return; const{o1,o2,g}=ambientNodes;
  g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.4);
  setTimeout(()=>{try{o1.stop();o2.stop();}catch(e){}},500); ambientNodes=null;}
function playClick(){const c=ensureAudio(); if(!c||!soundOn)return;
  const o=c.createOscillator(),g=c.createGain(); o.type='sine';
  o.frequency.setValueAtTime(500,c.currentTime); o.frequency.exponentialRampToValueAtTime(220,c.currentTime+0.12);
  g.gain.setValueAtTime(0.1,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.16);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.16);}
document.getElementById('sound-toggle').addEventListener('click',function(){
  soundOn=!soundOn; this.textContent=soundOn?'🔊':'🔇';
  if(soundOn){startAmbient();} else stopAmbient();
});
function renderDock(){
  const ids=sceneMode==='near'?['earth','moon']:['sun','mercury','venus','earth','mars','jupiter','saturn','uranus','neptune'];
  document.querySelectorAll('.dock-item').forEach((el,i)=>{
    el.style.display=ids.includes(PLANETS[i].id)?'flex':'none';
    el.classList.toggle('active',i===currentIndex);
  });
  document.getElementById('dock').style.display=sceneMode==='galaxy'?'none':'flex';
}
function setMode(mode){
  sceneMode=mode;
  document.querySelectorAll('.scale-tabs span').forEach((el,i)=>el.classList.toggle('active',['near','solar','galaxy'][i]===mode));
  const hint=document.getElementById('rotate-hint');
  if(mode==='galaxy'){
    group.visible=false;galaxyGroup.visible=true;
    document.getElementById('info-tag').textContent='MILKY WAY · 01';
    document.getElementById('info-name').textContent='银河系';
    document.getElementById('info-desc').textContent='旋转视角，探索恒星与旋臂构成的银河结构。这里展示的是程序生成的示意模型。';
    document.getElementById('stat-d').textContent='约 10万光年';
    document.getElementById('stat-p').textContent='约 2.3亿年';
    hint.textContent='拖动旋转 · 双指或滚轮缩放';
  }else{
    galaxyGroup.visible=false;group.visible=true;
    const preferred=mode==='near'?'earth':'sun';
    if(!(mode==='near'?['earth','moon']:['sun','mercury','venus','earth','mars','jupiter','saturn','uranus','neptune']).includes(PLANETS[currentIndex].id)){
      currentIndex=PLANETS.findIndex(p=>p.id===preferred);
    }
    applyPlanet(currentIndex);
    hint.textContent=mode==='near'?'地月探索 · 拖动旋转':'选择天体 · 拖动旋转';
  }
  renderDock();playClick();
}
document.querySelectorAll('.scale-tabs span').forEach((el,i)=>{
  el.setAttribute('role','button');el.setAttribute('tabindex','0');
  const run=()=>setMode(['near','solar','galaxy'][i]);
  el.addEventListener('click',run);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run();}});
});
document.getElementById('reset-view').addEventListener('click',()=>{
  rotX=.15;rotY=0;camera.position.set(0,0,sceneMode==='galaxy'?13:5);playClick();
});
let pinchDistance=0;
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===2)pinchDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinchDistance)camera.position.z=Math.max(sceneMode==='galaxy'?7:2.5,Math.min(sceneMode==='galaxy'?22:9,camera.position.z+(pinchDistance-d)*.012));
    pinchDistance=d;
  }
},{passive:false});
renderer.domElement.addEventListener('touchend',()=>pinchDistance=0,{passive:true});

applyPlanet(currentIndex);
renderDock();
startAmbient();
onResize();
animate();
</script>
</body>
</html>
